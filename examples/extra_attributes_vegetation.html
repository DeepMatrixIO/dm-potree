	<!-- INCLUDE ADDITIONAL DEPENDENCIES HERE -->
	<!-- INCLUDE SETTINGS HERE -->

	<div class="potree_container" style="position: absolute; width: 100%; height: 100%; left: 0px; top: 0px; ">
		<div id="potree_render_area" style="background-image: url('../build/potree/resources/images/background.jpg');">
		</div>
		<div id="potree_sidebar_container"> </div>
	</div>

	<script type="module">

		import * as THREE from "../libs/three.js/build/three.module.js";

		window.viewer = new Potree.Viewer(document.getElementById("potree_render_area"));

		viewer.setEDLEnabled(true);
		viewer.setFOV(60);
		viewer.setPointBudget(1_000_000);
		viewer.loadSettingsFromURL();
		viewer.setBackground("skybox");

		viewer.loadGUI(() => {
			viewer.setLanguage('en');
			$("#menu_scene").next().show();
			viewer.toggleSidebar();
		});

		viewer.setDescription(`
		This example shows various ways to use annotations.
		They can be used to bookmark and describe locations,
		move the camera to a predefined point of view on click,
		and to provide programmable buttons at specific locations.
		`);

		let sceneSG = new Potree.Scene();

		viewer.setScene(sceneSG);

		// Sorvilier point cloud in scene 1
		//Potree.loadPointCloud("inegi_point_cloud_cov_40cm.las_converted/metadata.json", "inegi", function (e) {


		//Potree.loadPointCloud("../pointclouds/vegetation_zone_ROW_75_20_1_64930dd1.las_converted/metadata.json", "inegi", function (e) {
		Potree.loadPointCloud("../pointclouds/vegetation_zone_ROW_175_20_2_71860e0d.las_converted/metadata.json", "vegetation", function (e) {
			sceneSG.addPointCloud(e.pointcloud);
			//sceneSG.view.position.set(590030, 231767, 1007);
			viewer.zoomTo(e.pointcloud)

			e.pointcloud.material.activeAttributeName = "classification";

			//material.size = 1;
			//material.pointSizeType = Potree.PointSizeType.ADAPTIVE;

			// let clip= new PolygonClipVolume(viewer.getCamera());
			// viewer.scene.addClipVolume(clip);
			//viewer.scene.polygonClipVolumes[0].markers.map(marker => [marker.position.x,marker.position.y,marker.position.z]).toString()

		}

		);







	</script>

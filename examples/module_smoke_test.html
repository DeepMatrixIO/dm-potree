<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Potree Module Smoke Test</title>

  <link rel="stylesheet" type="text/css" href="../build/potree/potree.css">

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #0b0f14;
      color: #d7e0ea;
    }

    #potree_render_area {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-image: url('../build/potree/resources/images/background.jpg');
      background-size: cover;
      background-position: center;
    }

    #status {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.65);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      max-width: 420px;
      line-height: 1.4;
    }

    #status.ok {
      border: 1px solid #1d7f4b;
    }

    #status.error {
      border: 1px solid #a63d3d;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://esm.sh/three@0.182.0",
      "three/": "https://esm.sh/three@0.182.0/",
      "proj4": "https://esm.sh/proj4@2.19.10",
      "@tweenjs/tween.js": "https://esm.sh/@tweenjs/tween.js@25.0.0",
      "jquery": "https://esm.sh/jquery@3.7.1",
      "i18next": "https://esm.sh/i18next@25.5.2",
      "d3": "https://esm.sh/d3@7.9.0",
      "uuid": "https://esm.sh/uuid@13.0.0"
    }
  }
  </script>
</head>
<body>
  <div id="status">Loading module...</div>
  <div id="potree_render_area"></div>

  <script type="module">
    const statusEl = document.getElementById('status');

    function setStatus(message, state) {
      statusEl.textContent = message;
      statusEl.className = state || '';
    }

    try {
      const Potree = await import('../build/potree/potree.module.js');

      window.viewer = new Potree.Viewer(document.getElementById('potree_render_area'));
      viewer.setEDLEnabled(false);
      viewer.setFOV(60);
      viewer.setPointBudget(1_000_000);
      viewer.setBackground('skybox');

      setStatus('Module loaded. Loading point cloud...', 'ok');

      Potree.loadPointCloud('../pointclouds/vol_total/cloud.js', 'vol_total', (e) => {
        viewer.scene.addPointCloud(e.pointcloud);
        viewer.fitToScreen();
        setStatus('Success: potree.module.js loaded and point cloud rendered.', 'ok');
      });
    } catch (err) {
      console.error(err);
      setStatus(`Failed: ${err.message}`, 'error');
    }
  </script>
</body>
</html>
